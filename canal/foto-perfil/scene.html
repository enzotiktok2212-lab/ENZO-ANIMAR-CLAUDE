function noiseTex(scale, strength) {

    const n = 128 + (weave - 0.5) * strength + (rnd() - 0.5) * 30;
    d.data[i * 4] = d.data[i * 4 + 1] = d.data[i * 4 + 2] = n; d.data[i * 4 + 3] = 255;

}

{

// locks: tapered, curved, flattened tubes
function makeLock(base, dir, bend, len, rad, flat) {
  const rings = 16, sides = 10; const posA = [], colA = [], idx = [];
  const root = new THREE.Color('#2e1b10'), tip = new THREE.Color('#a8733f');
  const pt = (t) => base.clone().addScaledVector(dir, len * t).addScaledVector(bend, len * t * t);
  for (let i = 0; i <= rings; i++) {
    const t = i / rings; const p = pt(t);
    const tan = pt(Math.min(t + 0.01, 1)).sub(pt(Math.max(t - 0.01, 0))).normalize();
    let side = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0, 1, 0.3)).normalize();
    if (side.lengthSq() < 0.1) side.set(1, 0, 0);
    const up = new THREE.Vector3().crossVectors(side, tan).normalize();
    const r = rad * Math.pow(1 - t, 0.75) + 0.004;
    const cc = root.clone().lerp(tip, Math.pow(t, 1.3));
    for (let j = 0; j < sides; j++) {
      const a = j / sides * Math.PI * 2;
      const q = p.clone().addScaledVector(side, Math.cos(a) * r).addScaledVector(up, Math.sin(a) * r * flat);
      posA.push(q.x, q.y, q.z); colA.push(cc.r, cc.g, cc.b);
    }
  }
  for (let i = 0; i < rings; i++) for (let j = 0; j < sides; j++) {
    const a = i * sides + j, b = i * sides + (j + 1) % sides, c = a + sides, d = b + sides;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(posA, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colA, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
const lockMat = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.42, sheen: 1, sheenColor: new THREE.Color('#c08a5c'), sheenRoughness: 0.3, clearcoat: 0.25, clearcoatRoughness: 0.4 });

{
  const cp = capProf.pts; const n = cp.length;
