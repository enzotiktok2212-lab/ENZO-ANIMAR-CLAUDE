<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:"Inter Display","Inter",sans-serif;background:#050a24;position:relative;color:#fff}
.bg{position:absolute;inset:0;background:
 radial-gradient(ellipse 900px 700px at 50% 52%,#1b2a8f 0%,#0b1450 45%,#040820 80%);}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 6px);mix-blend-mode:overlay}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 260px 80px #000}
.top{position:absolute;top:150px;left:0;right:0;display:flex;justify-content:center;gap:22px;align-items:center}
.live{background:#e8162b;font-weight:900;font-size:46px;padding:10px 26px 10px 22px;border-radius:10px;display:flex;align-items:center;gap:14px;letter-spacing:2px;box-shadow:0 0 40px rgba(232,22,43,.6)}
.live i{width:22px;height:22px;border-radius:50%;background:#fff;display:block}
.time{font-family:"DejaVu Sans Mono",monospace;font-weight:700;font-size:46px;color:#c8ff2e;border:3px solid #c8ff2e;padding:8px 22px;border-radius:10px;text-shadow:0 0 18px #c8ff2e}
/* eye chart */
.chart{position:absolute;left:150px;right:150px;top:300px;height:1060px;background:#f4f1e6;border-radius:28px;
 box-shadow:0 0 0 14px #0d1238,0 0 0 18px #c8ff2e,0 40px 120px rgba(0,0,0,.7),0 0 160px rgba(200,255,46,.25);transform:rotate(-2deg);overflow:hidden}
.chart:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 30% 10%,rgba(255,255,255,.7),transparent 55%)}
.row{position:relative;display:flex;justify-content:center;align-items:center;gap:.18em;color:#0b0f2a;font-weight:900;line-height:1}
.n{position:absolute;left:34px;font-size:22px;font-weight:600;color:#8a8a8a;font-family:"DejaVu Sans Mono",monospace}
.r{position:absolute;right:34px;font-size:22px;font-weight:600;color:#8a8a8a;font-family:"DejaVu Sans Mono",monospace}
.hl{color:#e8162b}
.redline{height:6px;background:#e8162b;margin:22px 60px 14px;position:relative}
.redline span{position:absolute;right:0;top:-40px;font-size:24px;color:#e8162b;font-weight:800;font-family:"DejaVu Sans Mono",monospace}
.blur1{filter:blur(1.2px)}.blur2{filter:blur(2.4px)}.blur3{filter:blur(3.8px);opacity:.85}
/* eye */
.eye{position:absolute;left:50%;top:1270px;transform:translateX(-50%);width:420px;height:220px;z-index:5}
/* title */
.title{position:absolute;left:0;right:0;top:1500px;text-align:center}
.title h1{font-size:150px;font-weight:900;letter-spacing:-3px;color:#c8ff2e;line-height:.9;
 text-shadow:0 8px 0 #0a3d00,0 0 60px rgba(200,255,46,.55);transform:skewX(-6deg)}
.title p{margin-top:28px;font-size:44px;font-weight:700;letter-spacing:1px}
.title p b{background:#fff;color:#050a24;padding:2px 14px;border-radius:8px}
.zz{position:absolute;font-weight:900;color:#c8ff2e;opacity:.9;text-shadow:0 0 20px #c8ff2e}
</style></head><body>
<div class="bg"></div>
<div class="top"><div class="live"><i></i>LIVE</div><div class="time">03:07</div></div>

<div class="chart">
 <div style="height:70px"></div>
 <div class="row" style="font-size:240px"><span class="n">1</span>B<span class="r">20/200</span></div>
 <div style="height:40px"></div>
 <div class="row" style="font-size:132px"><span class="n">2</span>IST&nbsp;DU<span class="r">20/100</span></div>
 <div style="height:34px"></div>
 <div class="row" style="font-size:96px"><span class="n">3</span>WIRK<span class="hl">LICH</span><span class="r">20/50</span></div>
 <div style="height:30px"></div>
 <div class="row" style="font-size:130px;color:#e8162b"><span class="n">4</span>WACH?<span class="r">20/40</span></div>
 <div class="redline"><span>20/20</span></div>
 <div class="row blur1" style="font-size:44px;letter-spacing:.3em"><span class="n" style="filter:none">5</span>D U &nbsp;G Ä H N S T</div>
 <div style="height:22px"></div>
 <div class="row blur2" style="font-size:32px;letter-spacing:.35em">S C H O N &nbsp;J E T Z T</div>
 <div style="height:18px"></div>
 <div class="row blur3" style="font-size:22px;letter-spacing:.4em">N I C H T &nbsp;W E I T E R L E S E N</div>
</div>

<svg class="eye" viewBox="0 0 420 220">
 <defs><clipPath id="c"><path d="M20 110 Q210 -20 400 110 Q210 240 20 110Z"/></clipPath>
 <radialGradient id="ir"><stop offset="0" stop-color="#eaff9a"/><stop offset=".55" stop-color="#c8ff2e"/><stop offset="1" stop-color="#3f7a00"/></radialGradient></defs>
 <path d="M20 110 Q210 -20 400 110 Q210 240 20 110Z" fill="#fff" stroke="#050a24" stroke-width="14"/>
 <g clip-path="url(#c)">
  <circle cx="210" cy="120" r="70" fill="url(#ir)"/><circle cx="210" cy="120" r="32" fill="#050a24"/><circle cx="232" cy="98" r="12" fill="#fff"/>
  <path d="M0 0 H420 V96 Q210 140 0 96Z" fill="#f2c9a5"/>
  <path d="M0 96 Q210 140 420 96" fill="none" stroke="#050a24" stroke-width="14"/>
 </g>
 <path d="M20 110 Q210 -20 400 110 Q210 240 20 110Z" fill="none" stroke="#050a24" stroke-width="14"/>
 <g stroke="#050a24" stroke-width="10" stroke-linecap="round"><line x1="120" y1="128" x2="105" y2="160"/><line x1="210" y1="136" x2="210" y2="172"/><line x1="300" y1="128" x2="315" y2="160"/></g>
</svg>
<div class="zz" style="font-size:90px;left:770px;top:1230px;transform:rotate(12deg)">Z</div>
<div class="zz" style="font-size:62px;left:850px;top:1170px;transform:rotate(18deg)">z</div>
<div class="zz" style="font-size:44px;left:905px;top:1120px;transform:rotate(22deg)">z</div>

<div class="title"><h1>WACH-CHECK</h1><p>Nur <b>1 von 10</b> schafft Zeile 5</p></div>
<div class="scan"></div><div class="vig"></div>
</body></html>
